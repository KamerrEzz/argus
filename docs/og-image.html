<!doctype html>
<!--
  Source for docs/og-image.png, the social preview card.
  Render at exactly 1200x630:

    npx playwright screenshot --viewport-size=1200,630 docs/og-image.html docs/og-image.png

  Kept in the repository so the card is reproducible instead of a one-off export.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Argus — social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#07080c; --text:#e9e7e2; --dim:#a5a19a; --faint:#726f69;
    --amber:#e3a63f; --amber-2:#f3d9a4;
    --display:"Fraunces","Iowan Old Style",Georgia,serif;
    --sans:"Archivo",ui-sans-serif,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    background-image:
      radial-gradient(760px 460px at 88% 26%, rgba(227,166,63,.17), transparent 62%),
      radial-gradient(620px 380px at 4% 96%, rgba(127,209,192,.06), transparent 62%);
    background-repeat:no-repeat;
    position:relative;
  }
  /* concentric instrument rings, cropped by the card edge */
  .rings{position:absolute;right:-150px;top:-120px;width:820px;height:820px;opacity:.5}
  .grain{
    position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
  }
  .edge{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--amber),rgba(227,166,63,0) 62%)}
  .wrap{position:relative;z-index:2;height:100%;padding:56px 72px 50px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-content:center}
  .kicker{font-family:var(--mono);font-size:14px;letter-spacing:.30em;text-transform:uppercase;color:var(--amber)}
  h1{
    font-family:var(--display);font-weight:600;font-size:138px;line-height:.9;letter-spacing:-.028em;
    margin:22px 0 24px;
  }
  h1 i{font-style:italic;font-weight:300;color:var(--amber)}
  .lede{font-size:29px;line-height:1.34;color:#cfccc5;max-width:660px}
  .lede b{color:var(--text);font-weight:600}
  .rule{width:118px;height:2px;background:var(--amber);margin:30px 0 22px;opacity:.85}
  .stack{font-family:var(--mono);font-size:13.5px;letter-spacing:.06em;color:var(--faint)}
  .url{font-family:var(--mono);font-size:14px;letter-spacing:.05em;color:var(--dim);margin-top:10px}
  .url b{color:var(--amber-2);font-weight:500}
  .eye{display:flex;align-items:center;justify-content:center}
  .eye svg{width:300px;height:300px;filter:drop-shadow(0 0 54px rgba(227,166,63,.34))}
  .ring{transform-origin:60px 60px}
  .r1{animation:none}
</style>
</head>
<body>
  <svg class="rings" viewBox="0 0 820 820" aria-hidden="true">
    <circle cx="410" cy="410" r="290" fill="none" stroke="rgba(227,166,63,.13)" stroke-width="1"/>
    <circle cx="410" cy="410" r="356" fill="none" stroke="rgba(227,166,63,.10)" stroke-width="1" stroke-dasharray="3 10"/>
    <circle cx="410" cy="410" r="404" fill="none" stroke="rgba(227,166,63,.07)" stroke-width="1" stroke-dasharray="1 8"/>
  </svg>
  <div class="grain"></div>

  <div class="wrap">
    <div>
      <p class="kicker">Self-hosted · LangGraph</p>
      <h1>Argus<i>.</i></h1>
      <p class="lede">The hundred-eyed reviewer for your pull requests. <b>Sandboxed checks, evidence-backed findings, one honest review.</b></p>
      <div class="rule"></div>
      <p class="stack">FASTIFY · NEXT.JS · PRISMA · BULLMQ · DOCKER</p>
      <p class="url">github.com/<b>KamerrEzz</b>/argus</p>
    </div>
    <div class="eye">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <radialGradient id="irg2" cx="50%" cy="46%">
            <stop offset="0%" stop-color="#f8e8c4"/>
            <stop offset="42%" stop-color="#e3a63f"/>
            <stop offset="100%" stop-color="#4a3512"/>
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="57" fill="none" stroke="rgba(227,166,63,.34)" stroke-width=".9"/>
        <circle cx="60" cy="60" r="47" fill="none" stroke="rgba(227,166,63,.32)" stroke-width="1" stroke-dasharray="2 7"/>
        <circle cx="60" cy="60" r="37" fill="none" stroke="rgba(127,209,192,.24)" stroke-width="1" stroke-dasharray="1 5"/>
        <circle cx="60" cy="60" r="30" fill="url(#irg2)"/>
        <ellipse cx="60" cy="60" rx="8.8" ry="25.5" fill="#07080c"/>
        <circle cx="60" cy="60" r="5.6" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1"/>
        <circle cx="47" cy="46" r="3.4" fill="rgba(255,255,255,.55)"/>
      </svg>
    </div>
  </div>
  <div class="edge"></div>
</body>
</html>
