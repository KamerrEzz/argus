name: acr

# Infrastructure (postgres, redis) is what `npm run dev:infra` starts. The app
# services are for a full container run; the host dev loop uses them separately.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acr}
      POSTGRES_DB: ${POSTGRES_DB:-acr}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acr} -d ${POSTGRES_DB:-acr}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # BullMQ needs keyspace persistence; a queue that dies with the container
    # loses reviews that were already accepted from GitHub.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: api
    image: acr/backend:local
    entrypoint: ["/sbin/tini", "--", "sh", "-c"]
    command: ["npm run db:deploy -w @acr/database"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-acr}:${POSTGRES_PASSWORD:-acr}@postgres:5432/${POSTGRES_DB:-acr}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment: &backend-env
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-acr}:${POSTGRES_PASSWORD:-acr}@postgres:5432/${POSTGRES_DB:-acr}?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # The API clones too (it owns the review when no worker is present), and
      # queued checks read the same paths the worker writes, so both mount /workspaces.
      SANDBOX_MODE: ${SANDBOX_MODE:-process}
      SANDBOX_WORKSPACE_ROOT: /workspaces
      REVIEW_COMMAND_EXECUTION: ${REVIEW_COMMAND_EXECUTION:-queued}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - workspaces:/workspaces
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment: *backend-env
    volumes:
      - workspaces:/workspaces
      # Only needed for SANDBOX_MODE=docker, and it hands the container root on
      # the host to whatever runs inside it. Off by default on purpose.
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  # Shared so a worker can open the exact directory path the API created.
  workspaces:
